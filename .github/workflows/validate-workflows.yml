name: Validate Workflows

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Workflow Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          python3 <<'PY'
          import pathlib
          import sys
          import yaml

          workflows_dir = pathlib.Path(".github/workflows")
          has_errors = False
          for file_path in sorted(workflows_dir.glob("*.yml")):
              try:
                  yaml.safe_load(file_path.read_text(encoding="utf-8"))
                  print(f"✓ {file_path.name} - Valid YAML")
              except Exception as error:
                  print(f"✗ {file_path.name} - Invalid YAML: {error}")
                  has_errors = True

          if has_errors:
              sys.exit(1)
          PY

      - name: Check for required secrets
        uses: actions/github-script@v7
        with:
          script: |
            const requiredSecrets = [
              'NETSPARKLE_PRIVATE_KEY',
              'NETSPARKLE_PUBLIC_KEY'
            ];
            
            console.log('Required secrets for workflows:');
            requiredSecrets.forEach(secret => {
              console.log(`  - ${secret}`);
            });
            
            console.log('\nNote: These secrets must be configured in repository settings.');

