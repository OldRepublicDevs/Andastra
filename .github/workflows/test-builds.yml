name: Test Builds

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  test-builds:
    name: Test Build - ${{ matrix.framework }}-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test a subset of builds for PRs
          - os: windows-latest
            framework: net48
            platform: win
            arch: x64
            rid: win-x64
            selfcontained: false
          - os: windows-latest
            framework: net9.0
            platform: win
            arch: x64
            rid: win-x64
            selfcontained: true
          - os: ubuntu-latest
            framework: net9.0
            platform: linux
            arch: x64
            rid: linux-x64
            selfcontained: true
          - os: macos-latest
            framework: net9.0
            platform: osx
            arch: arm64
            rid: osx-arm64
            selfcontained: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup .NET Framework (Windows only)
        if: matrix.framework == 'net48'
        uses: microsoft/setup-msbuild@v2

      - name: Run tests
        run: |
          dotnet restore tests/BioWare.Tests/BioWare.Tests.csproj
          dotnet build tests/BioWare.Tests/BioWare.Tests.csproj --framework net9.0 -c Release
          dotnet test tests/BioWare.Tests/BioWare.Tests.csproj --framework net9.0 -c Release --no-build --verbosity normal

      - name: Build NSSComp smoke publish
        shell: pwsh
        run: |
          $project = "src/Tools/NSSComp/NSSComp.csproj"
          $outputDir = "dist/test-build/${{ matrix.framework }}/${{ matrix.rid }}"

          dotnet publish $project `
            -c Release `
            -f ${{ matrix.framework }} `
            -r ${{ matrix.rid }} `
            --self-contained ${{ matrix.selfcontained }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -o $outputDir

      - name: Verify build output
        shell: pwsh
        run: |
          $outputDir = "dist/test-build/${{ matrix.framework }}/${{ matrix.rid }}"

          if (-not (Test-Path $outputDir)) {
            Write-Error "Build output directory not found: $outputDir"
            exit 1
          }

          $exeName = if ("${{ matrix.platform }}" -eq "win") { "nsscomp.exe" } else { "nsscomp" }
          $exePath = Join-Path $outputDir $exeName

          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found: $exePath"
            exit 1
          }

          Write-Host "✓ Build successful: $exePath"

          $fileInfo = Get-Item $exePath
          if ($fileInfo.Length -eq 0) {
            Write-Error "Executable is empty: $exePath"
            exit 1
          }

          Write-Host "✓ Executable size: $($fileInfo.Length) bytes"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ matrix.platform }}-${{ matrix.arch }}-logs
          path: |
            dist/test-build/**/*
            **/*.log
          retention-days: 7
