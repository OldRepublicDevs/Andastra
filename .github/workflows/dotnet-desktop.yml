name: .NET Core Desktop

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: build (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: |
          dotnet restore src/BioWare/BioWare.csproj
          dotnet restore tests/BioWare.Tests/BioWare.Tests.csproj
          dotnet restore src/Tools/OdyTools/OdyTools.csproj
          dotnet restore src/Tools/OdyPatch/OdyPatch.csproj
          dotnet restore src/Tools/OdyPatch.UI/OdyPatch.UI.csproj
          dotnet restore src/Tools/KotorCLI/KotorCLI.csproj
          dotnet restore src/Tools/ConvertKotorGame/ConvertKotorGame.csproj

      - name: Build BioWare and tests
        run: |
          dotnet build src/BioWare/BioWare.csproj --framework net9.0 -c ${{ matrix.configuration }} --no-restore
          dotnet build tests/BioWare.Tests/BioWare.Tests.csproj --framework net9.0 -c ${{ matrix.configuration }} --no-restore
          dotnet build tests/BioWare.Tests/BioWare.Tests.csproj --framework net48 -c ${{ matrix.configuration }} --no-restore

      - name: Test BioWare (net9.0)
        run: dotnet test tests/BioWare.Tests/BioWare.Tests.csproj --framework net9.0 -c ${{ matrix.configuration }} --no-build --verbosity normal

      - name: Test BioWare (net48)
        run: dotnet test tests/BioWare.Tests/BioWare.Tests.csproj --framework net48 -c ${{ matrix.configuration }} --no-build --verbosity normal

      - name: Build OdyTools, OdyPatch, OdyPatch.UI, KotorCLI, and ConvertKotorGame
        run: |
          dotnet build src/Tools/OdyTools/OdyTools.csproj --framework net9.0 -c ${{ matrix.configuration }} --no-restore
          dotnet build src/Tools/OdyPatch/OdyPatch.csproj --framework net9.0 -c ${{ matrix.configuration }} --no-restore
          dotnet build src/Tools/OdyPatch.UI/OdyPatch.UI.csproj --framework net9.0 -c ${{ matrix.configuration }} --no-restore
          dotnet build src/Tools/KotorCLI/KotorCLI.csproj --framework net9.0 -c ${{ matrix.configuration }} --no-restore
          dotnet build src/Tools/ConvertKotorGame/ConvertKotorGame.csproj --framework net9.0 -c ${{ matrix.configuration }} --no-restore

      - name: Smoke test KotorCLI
        run: dotnet run --project src/Tools/KotorCLI/KotorCLI.csproj --framework net9.0 -c ${{ matrix.configuration }} --no-build -- --help
